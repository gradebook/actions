name: Bootstrap Action

inputs:
  node-version:
    type: string
    required: false
    default: lts/jod
  package-manager:
    type: string
    required: false
    default: yarn
  git-ref:
    type: string
    required: false
    default: ''
  git-fetch-depth:
    type: number
    required: false
    default: 1 # Pulled from actions/checkout docs
  git-fetch-tags:
    type: boolean
    required: false
    default: false

runs:
  using: composite
  steps:
  - uses: actions/checkout@v4
    with:
      ref: ${{ inputs.git-ref }}
      fetch-depth: ${{ inputs.git-fetch-depth }}
      fetch-tags: ${{ inputs.git-fetch-tags }}
      show-progress: false
  - id: node_version
    name: Resolve node version
    shell: bash
    run: |
      # pnpm/setup expects e.g. jod while actions/setup-node expects e.g. lts/jod
      if [[ "$FOR_PNPM" == "true" ]]; then
        NODE_VERSION=$(echo "$NODE_VERSION" | sed 's:lts/::')
      fi

      if [[ "$NODE_VERSION" == "package_json" ]]; then
        echo "value=$(jq -r .engines.node package.json)" >> $GITHUB_OUTPUT
      else
        echo "value=$NODE_VERSION" >> $GITHUB_OUTPUT
      fi
    env:
      NODE_VERSION: ${{ inputs.node-version }}
      FOR_PNPM: ${{ inputs.package-manager == 'pnpm' }}
  - if: ${{ inputs.package-manager == 'pnpm' }}
    uses: pnpm/setup@v3.0.0
    with:
        version: 12
        cache: true
        install: false
        runtime: node@${{ steps.node_version.outputs.value }}
  - if: ${{ inputs.package-manager != 'pnpm' }}
    uses: actions/setup-node@v4
    with:
      node-version: ${{ steps.node_version.outputs.value }}
      cache: yarn
    env:
      FORCE_COLOR: 0
